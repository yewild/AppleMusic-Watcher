# 放到你的 GitHub 仓库路径：.github/workflows/check-apple-music.yml
name: Check Apple Music Availability

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # 需要把"已通知"状态写回 songs.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4 opencc-python-reimplemented

      - name: Run check
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python check_apple_music.py

      - name: Commit updated songs.json (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add songs.json
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "标记已上架歌曲"
          # 推送前先拉一次最新的，减少跟Worker那边并发修改冲突的概率
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "推送冲突，重试第 $i 次..."
            sleep 3
          done
