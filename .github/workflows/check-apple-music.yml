name: Check Apple Music Availability

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state.json
          key: apple-music-state

      - name: Run check
        env:
          SONG_NAME: ${{ vars.SONG_NAME }}
          ARTIST_NAME: ${{ vars.ARTIST_NAME }}
          COUNTRY: ${{ vars.COUNTRY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python check_apple_music.py

      - name: Save state
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: apple-music-state
