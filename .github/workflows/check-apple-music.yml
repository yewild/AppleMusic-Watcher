# 放到你的 GitHub 仓库路径：.github/workflows/check-apple-music.yml
name: Check Apple Music Availability

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # 允许脚本把新加的歌自动提交回仓库

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4 opencc-python-reimplemented

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state.json
          key: apple-music-state

      - name: Run check
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python check_apple_music.py

      - name: Save state
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: apple-music-state

      - name: Commit updated songs.json / config.json (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add songs.json config.json
          git diff --cached --quiet && echo "没有变更，跳过提交" || git commit -m "自动更新监听清单/通知格式"
          git push
